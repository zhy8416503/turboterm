name: Build IPA

# 手动触发: Actions 页面点 "Run workflow"
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: Xcode 构建 (不签名)
        run: |
          xcodebuild -project TurboTerm.xcodeproj \
            -scheme TurboTerm \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: 打包成 IPA (未签名)
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "APP: $APP_PATH"
          rm -rf Payload TurboTerm-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qr TurboTerm-unsigned.ipa Payload

      - name: 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: TurboTerm-unsigned-ipa
          path: TurboTerm-unsigned.ipa
          if-no-files-found: error
